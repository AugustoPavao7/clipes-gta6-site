<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortes Augusto - Autorização</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 32px 16px; line-height: 1.6; color: #1a1a1a; background: #fff; }
</style>
</head>
<body>
<h1>Cortes Augusto</h1>
<p id="msg">Concluindo a autorização...</p>
<script>
  // Repassa o código de autorização do TikTok para o programa rodando no computador do dono.
  var q = window.location.search;
  if (q.indexOf("code=") !== -1 || q.indexOf("error=") !== -1) {
    window.location.replace("http://127.0.0.1:8765/callback" + q);
  } else {
    document.getElementById("msg").textContent = "Nenhuma autorização em andamento.";
  }
</script>
</body>
</html>
